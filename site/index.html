<!doctype html>
<html lang="ja" data-environment="local">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="欧州サッカーの日程と結果を節ごとに確認。キックオフは日本時間。">
  <title>サッカー日程</title>
  <link rel="stylesheet" href="style.css?v=20261106-2">
  <script src="app.js?v=20261106-2" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">FOOTBALL SCHEDULE</p><h1>サッカー日程</h1><p id="site-subtitle" class="muted">欧州5大リーグ・CL ／ 日本時間（JST）</p></header>
    <nav id="competitions" aria-label="大会を選択"></nav>
    <section aria-labelledby="competition-title">
      <h2 id="competition-title">読み込み中</h2>
      <p id="freshness-warning" class="freshness-warning" role="status" hidden></p>
      <div class="view-switch" role="group" aria-label="表示内容">
        <button id="schedule-view" type="button" aria-pressed="true">日程・結果</button>
        <button id="standings-view" type="button" aria-pressed="false">順位表</button>
      </div>
      <div id="schedule-panel">
      <div class="round-nav">
        <button id="previous" type="button" disabled>← 前節</button>
        <h3 id="round-title">—</h3>
        <button id="next" type="button" disabled>次節 →</button>
      </div>
      <p id="message" role="status" aria-live="polite">試合データを読み込んでいます。</p>
      <div id="matches"></div>
      </div>
      <section id="standings-panel" hidden aria-label="順位表">
        <p id="standings-status" class="muted" role="status"></p>
        <p class="table-hint">表は左右にスクロールできます。順位とクラブ名は固定表示です。</p>
        <div id="standings"></div>
      </section>
      <noscript><p>試合の表示にはJavaScriptを有効にしてください。</p></noscript>
    </section>
    <footer><p id="updated">最終更新：未取得</p><p id="fetch-confirmed">取得確認：日時未確認</p><p>最終更新はデータ内容が変わった日時、取得確認は最後に正常取得できた日時です。</p><p>数時間ごとの更新です。取得元と定期処理の遅延があるため、リアルタイムの結果は保証しません。</p><p>Football data provided by the <a href="https://www.football-data.org/" rel="noreferrer">Football-Data.org API</a></p></footer>
  </main>
</body>
</html>
